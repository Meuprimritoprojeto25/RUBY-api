default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", Rails.root.join("db/development.sqlite3")) %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DATABASE_PATH", Rails.root.join("db/test.sqlite3")) %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_PATH", Rails.root.join("db/production.sqlite3")) %>
